[project]
name = "analysis-harlow-learning-sets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aind-behavior-vr-foraging-packaging >= 0.0.11",
    "aind-behavior-vr-foraging[data] >= 1.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pydantic",
    "ruff",
    "tqdm>=4.67.1",
    "scikit-learn>=1.8.0",
    "aind-data-access-api>=1.9.2",
    "pyarrow>=24.0.0",
    "marimo[sql]>=0.23.15",
    "duckdb>=1.5.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "polars>=1.43.2",  # 1.43.1 is yanked upstream
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "debugpy>=1.8",
    "moto[s3]>=5.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.marimo.runtime]
# Re-run cells that depend on src/analysis/features.py, src/analysis/plotting.py
# (or any other src/analysis/*.py module the notebook imports from) when those
# files change, instead of silently reusing the already-imported module. This is
# marimo's equivalent of IPython's %autoreload, but it re-executes the affected
# cells rather than hot-patching function bodies, so new module-level names work
# too.
auto_reload = "autorun"
