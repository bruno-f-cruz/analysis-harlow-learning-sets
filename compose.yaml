services:
  dev:
    build:
      context: .
    volumes:
      - .:/workspace
      - ./artifacts:/artifacts
    ports:
      - "2718:2718"
      - "8080:8080"
    working_dir: /workspace
    environment:
      - DATASET_URI=${DATASET_URI:-}
      - ARTIFACT_URI=${ARTIFACT_URI:-/artifacts}
      - AWS_REGION=${AWS_REGION:-us-west-2}
      # Reads need no credentials (public buckets). Writes (ARTIFACT_URI to a
      # private bucket, or --upload) use the host's normal credential chain.
      # Uncomment if not using SSO/instance roles:
      # - AWS_ACCESS_KEY_ID
      # - AWS_SECRET_ACCESS_KEY
    stdin_open: true
    tty: true

  analysis:
    build:
      context: .
    volumes:
      - .:/workspace
      - ./artifacts:/artifacts
    environment:
      - DATASET_URI=${DATASET_URI:-}
      - ARTIFACT_URI=${ARTIFACT_URI:-/artifacts}
      - AWS_REGION=${AWS_REGION:-us-west-2}
    working_dir: /workspace
    command: ["uv", "run", "python", "workflows/pipeline.py"]
    profiles: ["run"]
